    <!--
      Self-heal from transient module load failures. Occasionally Cloudflare's
      edge returns index.html's body (200, MIME text/html) for the exact hashed
      JS asset URL instead of the real file — confirmed live 2026-07-31: a
      cache-busted request (any query string) reliably got the correct file
      even while the bare exact path was affected, and it self-corrected within
      about a minute on its own. This catches that failure (script load errors
      don't bubble, so the listener must run in the capture phase) and forces a
      cache-busted reload, which reliably dodges it rather than a plain
      location.reload() that could hit the same bad lookup again. Rate-limited
      via sessionStorage so a genuinely broken deploy doesn't reload-loop.
    -->
    <script>
      (function () {
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t.tagName === 'SCRIPT' && t.getAttribute && t.getAttribute('type') === 'module') {
            var last = parseInt(sessionStorage.getItem('occ_reload_ts') || '0', 10);
            var now = Date.now();
            if (now - last > 15000) {
              sessionStorage.setItem('occ_reload_ts', String(now));
              var sep = location.search ? '&' : '?';
              location.replace(location.pathname + location.search + sep + '_occcb=' + now);
            }
          }
        }, true);
      })();
    </script>
