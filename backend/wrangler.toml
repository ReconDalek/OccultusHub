name = "occultushub-worker"
main = "src/index.js"
compatibility_date = "2024-12-16"

# Development environment
[env.development]
vars = { CORS_ORIGIN = "http://localhost:5173", JWT_SECRET = "sk_prod_7Kj9mNp2qRx8vBcDeFgHiJkLmNoPqRsTuVwXyZ0aB1cD2eF", TORN_API_KEY = "" }

[[env.development.d1_databases]]
binding = "DB"
database_name = "occultusdb"
database_id = "48ac7e16-8aab-4772-b624-8a7d1c230207"

# Production environment
[env.production]
vars = { CORS_ORIGIN = "https://occultushub.com", JWT_SECRET = "sk_prod_7Kj9mNp2qRx8vBcDeFgHiJkLmNoPqRsTuVwXyZ0aB1cD2eF", TORN_API_KEY = "", DISCORD_CLIENT_ID = "1137242446082879548", DISCORD_GUILD_ID = "856861435950268467", DISCORD_REDIRECT_URI = "https://occultushub-worker-production.rkilpatrick4221.workers.dev/api/discord/callback" }
triggers = { crons = ["0 */12 * * *", "0 14 * * 2", "*/10 * * * *", "0 1 * * *", "*/5 * * * *", "0 * * * *", "0 */6 * * *", "0 2 1 * *"] }
# "0 */12 * * *" — faction cache refresh every 12 hours + member sync (company cache updated by daily director-key fetch)
# "0 14 * * 2"   — Tuesday 14:00 UTC: ranked war match check + weekly chain history fetch (matchups announced 14:00 UTC / midnight NZT)
# "*/10 * * * *" — active war tracking (no-ops instantly if no wars are matched/active)
# "*/5 * * * *"  — Torn stock list cache refresh (current prices, all 35 stocks)
# "0 * * * *"    — per-stock price history snapshot (35 API calls, stored for charts)
# "0 1 * * *"    — daily: energy + personal stats + company profit snapshots + TCI alerts + armory low stock
# "0 */6 * * *"  — armory cache refresh every 6 hours (3 API calls, one per faction)
# "0 2 1 * *"    — 1st of month 02:00 UTC: stock monthly payout summary to Discord

[[env.production.d1_databases]]
binding = "DB"
database_name = "occultusdb"
database_id = "48ac7e16-8aab-4772-b624-8a7d1c230207"
